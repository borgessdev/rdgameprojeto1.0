<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Produtos - RD GAME</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .login-box .form-group {
            margin-bottom: 1.5rem;
        }

        .login-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .login-box input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-box button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
        }

        .login-error {
            color: #ff4444;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        .gerenciar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            background: #f5f5f5;
            display: none;
        }

        .gerenciar-container.ativo {
            display: block;
        }

        .gerenciar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #0066cc;
        }

        .gerenciar-header h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin: 0;
        }

        .btn-voltar {
            background: #666;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-voltar:hover {
            background: #444;
        }

        .btn-logout {
            background: #ff4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #cc0000;
        }

        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 1.5rem;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-submit {
            background: #0066cc;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .btn-submit:hover {
            background: #0052a3;
        }

        .btn-reset {
            background: #ddd;
            color: #1a1a1a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .btn-reset:hover {
            background: #bbb;
        }

        .produtos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .produto-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .produto-imagem {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .produto-info {
            padding: 1rem;
        }

        .produto-nome {
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .produto-categoria {
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .produto-preco {
            color: #0066cc;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .produto-estoque {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .produto-acoes {
            display: flex;
            gap: 0.5rem;
        }

        .btn-editar {
            background: #0066cc;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }

        .btn-editar:hover {
            background: #0052a3;
        }

        .btn-deletar {
            background: #ff4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }

        .btn-deletar:hover {
            background: #cc0000;
        }

        .mensagem {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .mensagem.sucesso {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
            display: block;
        }

        .mensagem.erro {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal.ativo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            margin: 0;
            color: #1a1a1a;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #1a1a1a;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .gerenciar-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .produtos-container {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 2rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🎮 RD GAME</h1>
            <p style="text-align: center; color: #666; margin-bottom: 2rem;">Gerenciar Produtos</p>
            <div class="login-error" id="loginError">Senha incorreta!</div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="senha">Senha de Acesso</label>
                    <input type="password" id="senha" placeholder="Digite a senha" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Área de Gerenciamento -->
    <div class="gerenciar-container" id="gerenciarContainer">
        <div class="gerenciar-header">
            <h1>🎮 Gerenciar Produtos</h1>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>

        <div id="mensagem" class="mensagem"></div>

        <!-- Formulário de Adicionar/Editar Produto -->
        <div class="form-container">
            <h2 class="form-title" id="formTitulo">➕ Adicionar Novo Produto</h2>
            
            <form id="produtoForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome do Produto *</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="console">Console</option>
                            <option value="game">Jogo</option>
                            <option value="accessory">Acessório</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="preco">Preço (R$) *</label>
                        <input type="number" id="preco" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="precoOriginal">Preço Original (R$)</label>
                        <input type="number" id="precoOriginal" step="0.01">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="estoque">Estoque *</label>
                        <input type="number" id="estoque" required>
                    </div>
                    <div class="form-group">
                        <label for="badge">Badge (new/sale)</label>
                        <select id="badge">
                            <option value="">Nenhum</option>
                            <option value="new">Novo</option>
                            <option value="sale">Promoção</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label for="imagem">URL da Imagem Principal *</label>
                        <input type="url" id="imagem" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="imagem2">URL da Imagem 2</label>
                        <input type="url" id="imagem2">
                    </div>
                    <div class="form-group">
                        <label for="imagem3">URL da Imagem 3</label>
                        <input type="url" id="imagem3">
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label for="descricao">Descrição *</label>
                        <textarea id="descricao" required></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit" id="btnSubmit">Adicionar Produto</button>
                    <button type="reset" class="btn-reset">Limpar</button>
                </div>
            </form>
        </div>

        <!-- Lista de Produtos -->
        <div>
            <h2 class="form-title">📦 Produtos Cadastrados</h2>
            <div class="produtos-container" id="produtosContainer">
                <!-- Produtos serão inseridos aqui -->
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Produto</h2>
                <button class="close-btn" onclick="fecharModal()">×</button>
            </div>
            <form id="editForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editNome">Nome do Produto *</label>
                        <input type="text" id="editNome" required>
                    </div>
                    <div class="form-group">
                        <label for="editCategoria">Categoria *</label>
                        <select id="editCategoria" required>
                            <option value="console">Console</option>
                            <option value="game">Jogo</option>
                            <option value="accessory">Acessório</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="editPreco">Preço (R$) *</label>
                        <input type="number" id="editPreco" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="editPrecoOriginal">Preço Original (R$)</label>
                        <input type="number" id="editPrecoOriginal" step="0.01">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="editEstoque">Estoque *</label>
                        <input type="number" id="editEstoque" required>
                    </div>
                    <div class="form-group">
                        <label for="editBadge">Badge (new/sale)</label>
                        <select id="editBadge">
                            <option value="">Nenhum</option>
                            <option value="new">Novo</option>
                            <option value="sale">Promoção</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label for="editImagem">URL da Imagem Principal *</label>
                        <input type="url" id="editImagem" required>
                    </div>
                </div>

                <div class="form-grid full">
                    <div class="form-group">
                        <label for="editDescricao">Descrição *</label>
                        <textarea id="editDescricao" required></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">Salvar Alterações</button>
                    <button type="button" class="btn-reset" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const SENHA_ADMIN = 'rdgame7878@!';
        let produtosEditando = null;
        let autenticado = false;

        // Verificar autenticação ao carregar
        document.addEventListener('DOMContentLoaded', () => {
            verificarAutenticacao();
            document.getElementById('loginForm').addEventListener('submit', fazerLogin);
            document.getElementById('produtoForm').addEventListener('submit', adicionarProduto);
            document.getElementById('editForm').addEventListener('submit', salvarEdicao);
        });

        function verificarAutenticacao() {
            const token = sessionStorage.getItem('rdgame_admin_token');
            if (token === 'autenticado') {
                autenticado = true;
                mostrarGerenciador();
            }
        }

        function fazerLogin(e) {
            e.preventDefault();
            const senha = document.getElementById('senha').value;
            
            if (senha === SENHA_ADMIN) {
                sessionStorage.setItem('rdgame_admin_token', 'autenticado');
                autenticado = true;
                document.getElementById('loginError').style.display = 'none';
                mostrarGerenciador();
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('senha').value = '';
            }
        }

        function mostrarGerenciador() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('gerenciarContainer').classList.add('ativo');
            carregarProdutos();
        }

        function logout() {
            sessionStorage.removeItem('rdgame_admin_token');
            autenticado = false;
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('gerenciarContainer').classList.remove('ativo');
            document.getElementById('loginForm').reset();
            document.getElementById('senha').focus();
        }

        function carregarProdutos() {
            const container = document.getElementById('produtosContainer');
            container.innerHTML = '';

            products.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'produto-card';
                card.innerHTML = `
                    <img src="${produto.image}" alt="${produto.name}" class="produto-imagem">
                    <div class="produto-info">
                        <div class="produto-nome">${produto.name}</div>
                        <div class="produto-categoria">${produto.category}</div>
                        <div class="produto-preco">R$ ${produto.price.toFixed(2)}</div>
                        <div class="produto-estoque">Estoque: ${produto.stock}</div>
                        <div class="produto-acoes">
                            <button class="btn-editar" onclick="abrirEdicao(${produto.id})">Editar</button>
                            <button class="btn-deletar" onclick="deletarProduto(${produto.id})">Deletar</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function adicionarProduto(e) {
            e.preventDefault();

            const imagens = [document.getElementById('imagem').value];
            if (document.getElementById('imagem2').value) {
                imagens.push(document.getElementById('imagem2').value);
            }
            if (document.getElementById('imagem3').value) {
                imagens.push(document.getElementById('imagem3').value);
            }

            const novoProduto = {
                id: Math.max(...products.map(p => p.id), 0) + 1,
                name: document.getElementById('nome').value,
                category: document.getElementById('categoria').value,
                price: parseFloat(document.getElementById('preco').value),
                originalPrice: parseFloat(document.getElementById('precoOriginal').value) || parseFloat(document.getElementById('preco').value),
                image: document.getElementById('imagem').value,
                images: imagens,
                description: document.getElementById('descricao').value,
                rating: 4.5,
                reviews: 0,
                stock: parseInt(document.getElementById('estoque').value),
                badge: document.getElementById('badge').value || null
            };

            products.push(novoProduto);
            localStorage.setItem('rdgame_products', JSON.stringify(products));

            mostrarMensagem('Produto adicionado com sucesso!', 'sucesso');
            document.getElementById('produtoForm').reset();
            carregarProdutos();
        }

        function abrirEdicao(id) {
            const produto = products.find(p => p.id === id);
            if (!produto) return;

            produtosEditando = id;
            document.getElementById('editNome').value = produto.name;
            document.getElementById('editCategoria').value = produto.category;
            document.getElementById('editPreco').value = produto.price;
            document.getElementById('editPrecoOriginal').value = produto.originalPrice;
            document.getElementById('editEstoque').value = produto.stock;
            document.getElementById('editBadge').value = produto.badge || '';
            document.getElementById('editImagem').value = produto.image;
            document.getElementById('editDescricao').value = produto.description;

            document.getElementById('editModal').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('editModal').classList.remove('ativo');
            produtosEditando = null;
        }

        function salvarEdicao(e) {
            e.preventDefault();

            const produto = products.find(p => p.id === produtosEditando);
            if (!produto) return;

            produto.name = document.getElementById('editNome').value;
            produto.category = document.getElementById('editCategoria').value;
            produto.price = parseFloat(document.getElementById('editPreco').value);
            produto.originalPrice = parseFloat(document.getElementById('editPrecoOriginal').value);
            produto.stock = parseInt(document.getElementById('editEstoque').value);
            produto.badge = document.getElementById('editBadge').value || null;
            produto.image = document.getElementById('editImagem').value;
            produto.images = [document.getElementById('editImagem').value];
            produto.description = document.getElementById('editDescricao').value;

            localStorage.setItem('rdgame_products', JSON.stringify(products));
            mostrarMensagem('Produto atualizado com sucesso!', 'sucesso');
            fecharModal();
            carregarProdutos();
        }

        function deletarProduto(id) {
            if (confirm('Tem certeza que deseja deletar este produto?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('rdgame_products', JSON.stringify(products));
                mostrarMensagem('Produto deletado com sucesso!', 'sucesso');
                carregarProdutos();
            }
        }

        function mostrarMensagem(texto, tipo) {
            const msg = document.getElementById('mensagem');
            msg.textContent = texto;
            msg.className = `mensagem ${tipo}`;
            setTimeout(() => {
                msg.className = 'mensagem';
            }, 3000);
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                fecharModal();
            }
        }
    </script>
</body>
</html>
