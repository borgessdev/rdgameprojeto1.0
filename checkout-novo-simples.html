<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - RD GAME</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .checkout-form {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1a3a52;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .payment-method {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .payment-method:hover {
            border-color: #0066cc;
            background: #f0f7ff;
        }

        .payment-method.active {
            border-color: #0066cc;
            background: #e6f2ff;
        }

        .payment-method input {
            display: none;
        }

        .payment-method label {
            cursor: pointer;
            display: block;
            font-weight: 500;
        }

        .order-summary {
            background: white;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .order-summary h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1a3a52;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .order-item-name {
            flex: 1;
        }

        .order-item-price {
            font-weight: bold;
            color: #0066cc;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #0066cc;
            color: #1a3a52;
        }

        .btn-checkout {
            width: 100%;
            padding: 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-checkout:hover {
            background: #0052a3;
        }

        .btn-checkout:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #cardForm {
            display: none;
        }

        #cardForm.active {
            display: block;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="logo.png" alt="RD GAME">
                <span>RD GAME</span>
            </div>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="index.html#consoles">Consoles</a>
                <a href="index.html#jogos">Jogos</a>
                <a href="index.html#acessorios">Acessórios</a>
                <a href="index.html#novidades">Novidades</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="checkout-container">
        <!-- Formulário -->
        <div class="checkout-form">
            <h2>Finalizar Compra</h2>

            <!-- Dados Pessoais -->
            <div class="form-section">
                <h3>📋 Dados Pessoais</h3>
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" id="fullName" placeholder="João Silva" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="joao@email.com" required>
                </div>
                <div class="form-group">
                    <label>Telefone *</label>
                    <input type="tel" id="phone" placeholder="(21) 99999-9999" required>
                </div>
                <div class="form-group">
                    <label>CPF *</label>
                    <input type="text" id="cpf" placeholder="123.456.789-00" required>
                </div>
            </div>

            <!-- Endereço -->
            <div class="form-section">
                <h3>📍 Endereço de Entrega</h3>
                <div class="form-group">
                    <label>Rua *</label>
                    <input type="text" id="street" placeholder="Rua das Flores" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Número *</label>
                        <input type="text" id="number" placeholder="123" required>
                    </div>
                    <div class="form-group">
                        <label>Complemento</label>
                        <input type="text" id="complement" placeholder="Apto 101">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Bairro *</label>
                        <input type="text" id="neighborhood" placeholder="Centro" required>
                    </div>
                    <div class="form-group">
                        <label>Cidade *</label>
                        <input type="text" id="city" placeholder="Rio de Janeiro" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>UF *</label>
                        <input type="text" id="state" placeholder="RJ" maxlength="2" required>
                    </div>
                    <div class="form-group">
                        <label>CEP *</label>
                        <input type="text" id="cep" placeholder="20000-000" required>
                    </div>
                </div>
            </div>

            <!-- Método de Pagamento -->
            <div class="form-section">
                <h3>💳 Método de Pagamento</h3>
                <div class="payment-methods">
                    <div class="payment-method active">
                        <input type="radio" id="cardPayment" name="paymentMethod" value="card" checked>
                        <label for="cardPayment">💳 Cartão de Crédito</label>
                    </div>
                    <div class="payment-method">
                        <input type="radio" id="pixPayment" name="paymentMethod" value="pix">
                        <label for="pixPayment">📱 PIX</label>
                    </div>
                </div>
            </div>

            <!-- Formulário de Cartão (Mercado Pago Bricks) -->
            <div id="cardForm" class="form-section active">
                <h3>Dados do Cartão</h3>
                <div id="cardContainer"></div>
            </div>

            <!-- Botão de Pagamento -->
            <button class="btn-checkout" id="payButton">Finalizar Compra</button>
        </div>

        <!-- Resumo do Pedido -->
        <aside class="order-summary">
            <h3>📦 Resumo do Pedido</h3>
            <div id="orderItems"></div>
            <div class="order-total">
                <span>Total:</span>
                <span id="totalPrice">R$ 0,00</span>
            </div>
        </aside>
    </main>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>
        // Inicializar Mercado Pago
        const mp = new MercadoPago('TEST-e5846dfa-3eaf-4636-8b66-2fb94c502bcd');

        // Carregar carrinho
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const orderItems = document.getElementById('orderItems');
            let total = 0;

            orderItems.innerHTML = '';

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                if (product) {
                    const itemTotal = product.price * item.quantity;
                    total += itemTotal;

                    orderItems.innerHTML += `
                        <div class="order-item">
                            <div class="order-item-name">${product.name} x${item.quantity}</div>
                            <div class="order-item-price">R$ ${itemTotal.toFixed(2).replace('.', ',')}</div>
                        </div>
                    `;
                }
            });

            document.getElementById('totalPrice').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
            return total;
        }

        // Alternar método de pagamento
        document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const cardForm = document.getElementById('cardForm');
                if (e.target.value === 'card') {
                    cardForm.classList.add('active');
                } else {
                    cardForm.classList.remove('active');
                }
            });
        });

        // Inicializar Bricks
        function initBricks() {
            const bricksBuilder = mp.bricks();
            bricksBuilder.create('payment', {
                initialization: {
                    amount: loadCart()
                },
                callbacks: {
                    onReady: () => console.log('✅ Bricks pronto'),
                    onSubmit: (data) => {
                        console.log('Dados do pagamento:', data);
                        processPayment(data);
                    },
                    onError: (error) => console.error('Erro:', error)
                }
            }).then(() => {
                console.log('✅ Bricks inicializado');
            }).catch(error => {
                console.error('Erro ao inicializar Bricks:', error);
            });
        }

        // Processar pagamento
        async function processPayment(data) {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            if (!fullName || !email || !phone) {
                alert('Por favor, preencha todos os dados pessoais!');
                return;
            }

            try {
                const response = await fetch('/api/mercado-pago/process-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...data,
                        payer: { fullName, email, phone }
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Pagamento aprovado!');
                    localStorage.removeItem('cart');
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Erro: ' + result.message);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao processar pagamento');
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
            initBricks();
        });
    </script>
</body>
</html>
